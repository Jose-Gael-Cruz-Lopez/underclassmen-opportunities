name: Update READMEs

# DISARMED 2026-08-08 — manual dispatch only.
#
# README.md is the source of truth. update_readmes.py regenerates only the
# INTERNSHIPS / PROGRAMS / RESEARCH / SCHOLARSHIPS regions, and it emits a
# schema with no Status column and no Ambassador / HBCU / Women / Rising
# Freshmen / State tables. listings.json has meanwhile diverged badly: of its
# 112 visible entries only ~10 still match the README, and 94 are inactive.
#
# Running this today would delete every ✅/🔥/⏳ badge in those four tables and
# replace their rows with stale data. The push trigger is therefore removed so
# an approved contribution can't fire it. Do NOT re-enable until the generator
# emits the live 7-column schema for all nine tables AND a dry run produces an
# empty diff against README.md.

on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update READMEs
        id: update
        run: |
          python .github/scripts/update_readmes.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet README.md; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "${{ steps.update.outputs.commit_message }}"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done

      - name: Report failure
        if: failure()
        run: |
          echo "Error updating README: ${{ steps.update.outputs.error_message }}"
          exit 1
