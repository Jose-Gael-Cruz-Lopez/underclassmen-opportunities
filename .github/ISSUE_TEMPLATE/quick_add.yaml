name: Quick Add
description: Quickly add an opportunity with just a link and basic info
title: "Quick Add"
labels: ["new_opportunity", "quick_add"]
body:
  - type: markdown
    attributes:
      value: |
        ## Quick Add Opportunity
        Submit a currently open college freshman/sophomore opportunity in any major. A maintainer verifies eligibility before publication.

  - type: input
    id: url
    attributes:
      label: Link
      placeholder: https://example.edu/programs/sophomore-health
    validations:
      required: true

  - type: input
    id: company_name
    attributes:
      label: Company/Organization
      placeholder: University, hospital, nonprofit, or employer
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Role/Program Name
      placeholder: First-Year Humanities Research Program
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      multiple: false
      options:
        - "Internship"
        - "Program"
        - "Research"
        - "Scholarship"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location (Optional)
      description: Leave blank for "Multiple Locations"
      placeholder: San Francisco, CA; Remote
    validations:
      required: false

  - type: input
    id: field
    attributes:
      label: Research Field (Optional, for Research only)
      placeholder: Humanities, Public Health, Agriculture, Computer Science
    validations:
      required: false
