name: New Opportunity
description: Contribute an underclassmen opportunity to our list
title: "New Opportunity"
labels: ["new_opportunity"]
body:
  - type: markdown
    attributes:
      value: |
        ## New Underclassmen Opportunity Contribution
        Thanks for taking the time to contribute!
        > Make sure you've read `CONTRIBUTING.md` before submitting your opportunity.
        > This repository welcomes **every major**, with programs specifically targeting college freshmen/sophomores or clearly identified incoming college freshmen.

  - type: input
    id: url
    attributes:
      label: Link to Opportunity Posting
      placeholder: https://example.edu/scholarships/first-year-arts
    validations:
      required: true

  - type: input
    id: company_name
    attributes:
      label: Company/Organization Name
      placeholder: ex. University, hospital, nonprofit, or employer
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Program/Role Title
      placeholder: ex. Sophomore Accounting Insight Program
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which section should this opportunity appear in?
      multiple: false
      options:
        - "Internship - First-/second-year internships in any field"
        - "Program - Fellowships, externships, career exploration, and early assurance"
        - "Research - First-/second-year research and creative inquiry"
        - "Scholarship - Named first-/second-year or incoming college freshman awards"
    validations:
      required: true

  - type: dropdown
    id: opportunity_type
    attributes:
      label: Type of Opportunity
      description: What kind of opportunity is this?
      multiple: false
      options:
        - "Internship"
        - "Fellowship"
        - "Externship"
        - "Scholarship"
        - "Mentorship Program"
        - "Research"
        - "Other"
    validations:
      required: true

  - type: input
    id: field
    attributes:
      label: Field/Area (For Research Programs Only)
      description: |
        If this is a research program, what field or area is it in?
        Leave blank for non-research opportunities.
      placeholder: ex. Public Health, History, Agriculture, Computer Science
    validations:
      required: false

  - type: dropdown
    id: target_year
    attributes:
      label: Target Year
      description: Which year students is this opportunity designed for?
      multiple: true
      options:
        - "Freshman (1st year)"
        - "Sophomore (2nd year)"
        - "Both Freshman & Sophomore"
        - "Any Underclassmen"
        - "Incoming College Freshman"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: |
        Where is the opportunity located?
        Please separate multiple locations with a comma.
        Include Remote if remote option available.
      placeholder: San Francisco, CA; Seattle, WA; Remote
    validations:
      required: true

  - type: dropdown
    id: season
    attributes:
      label: What season is this opportunity for?
      description: Select the season during which this opportunity takes place.
      multiple: false
      options:
        - "Summer"
        - "Fall"
        - "Winter"
        - "Spring"
        - "Multiple (rolling/year-round)"
    validations:
      required: true

  - type: dropdown
    id: sponsorship
    attributes:
      label: Sponsorship/Citizenship Requirements
      description: |
        What are the citizenship or sponsorship requirements?
        If the posting does not specify, select "Not Specified"
      multiple: false
      options:
        - Not Specified
        - Offers Sponsorship
        - Does Not Offer Sponsorship
        - U.S. Citizenship Required
        - U.S. Work Authorization Required
    validations:
      required: true

  - type: dropdown
    id: active
    attributes:
      label: Is this opportunity currently accepting applications?
      multiple: false
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email associated with your GitHub account (Optional)
      description: |
        If you would like to be credited as the contributor when the GitHub Action
        commits your contribution, please provide your email. If left blank, the
        contribution will be attributed to actions@github.com.
      placeholder: ex. yourname@email.com
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes (Optional)
      description: |
        Any extra context about the opportunity that might be helpful.
        This will not be shown on the repo but may help with approval.
      placeholder: Include the official freshman/sophomore eligibility, current application deadline, and any major or institution restrictions.
    validations:
      required: false
